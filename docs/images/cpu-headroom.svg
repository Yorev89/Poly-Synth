<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#2E2A26">Worst-case render time, 8 voices (share of the 2.9 ms deadline)</text>
  <!-- axis: 0..170% mapped to y 300..60 -->
  <line x1="90" y1="300" x2="690" y2="300" stroke="#8A7E74" stroke-width="1"/>
  <g font-size="12" fill="#8A7E74" text-anchor="end">
    <text x="82" y="304">0%</text>
    <text x="82" y="233">50%</text>
    <text x="82" y="162">100%</text>
    <text x="82" y="92">150%</text>
  </g>
  <line x1="90" y1="158" x2="690" y2="158" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="688" y="150" text-anchor="end" font-size="13" font-weight="700" fill="#C0392B">deadline — above this the audio breaks up</text>
  <!-- bars: height = pct * 1.412 -->
  <rect x="120" y="77" width="100" height="223" fill="#C0392B"/>
  <rect x="270" y="132" width="100" height="168" fill="#D9822B"/>
  <rect x="420" y="180" width="100" height="120" fill="#A87820"/>
  <rect x="570" y="214" width="100" height="86" fill="#5E8C3A"/>
  <g font-size="15" font-weight="700" fill="#2E2A26" text-anchor="middle">
    <text x="170" y="70">158%</text>
    <text x="320" y="125">119%</text>
    <text x="470" y="173">85%</text>
    <text x="620" y="207">61%</text>
  </g>
  <g font-size="12.5" fill="#2E2A26" text-anchor="middle">
    <text x="170" y="320">Original</text><text x="170" y="336">firmware</text>
    <text x="320" y="320">Float math</text><text x="320" y="336">fix</text>
    <text x="470" y="320">Filter envelope</text><text x="470" y="336">per buffer</text>
    <text x="620" y="320">Voice loop</text><text x="620" y="336">restructured</text>
  </g>
</svg>
