<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Poly-Synth audio signal chain diagram</title>
<desc>Signal flow from oscillators through envelope, filter, effects and DAC to audio output, for one voice of the Poly-Synth</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; font-weight: 400; fill: #555; }
.arr { stroke: #555; stroke-width: 1.2; fill: none; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .th { fill: #3C3489; }
.c-purple .ts { fill: #534AB7; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .th { fill: #085041; }
.c-teal .ts { fill: #0F6E56; }
.c-coral rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral .th { fill: #712B13; }
.c-coral .ts { fill: #993C1D; }
.c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
.c-amber .th { fill: #633806; }
.c-amber .ts { fill: #854F0B; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray .th { fill: #444441; }
</style>
</defs>

<text class="th" x="340" y="28" text-anchor="middle">Signal chain — one voice (×8 polyphony)</text>

<g class="c-purple"><rect x="30" y="50" width="120" height="50" rx="8" stroke-width="0.5"/><text class="th" x="90" y="69" text-anchor="middle" dominant-baseline="central">Osc 1</text><text class="ts" x="90" y="86" text-anchor="middle" dominant-baseline="central">Sine/Saw/Sq/Tri</text></g>
<g class="c-purple"><rect x="30" y="112" width="120" height="50" rx="8" stroke-width="0.5"/><text class="th" x="90" y="131" text-anchor="middle" dominant-baseline="central">Osc 2</text><text class="ts" x="90" y="148" text-anchor="middle" dominant-baseline="central">Detune 0–100¢</text></g>
<g class="c-purple"><rect x="30" y="174" width="120" height="50" rx="8" stroke-width="0.5"/><text class="th" x="90" y="193" text-anchor="middle" dominant-baseline="central">Sub osc</text><text class="ts" x="90" y="210" text-anchor="middle" dominant-baseline="central">−1 / −2 octaves</text></g>
<g class="c-purple"><rect x="30" y="236" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="90" y="258" text-anchor="middle" dominant-baseline="central">Noise</text></g>
<g class="c-purple"><rect x="30" y="288" width="120" height="40" rx="8" stroke-width="0.5"/><text class="th" x="90" y="310" text-anchor="middle" dominant-baseline="central">Ring mod</text></g>

<line x1="150" y1="75" x2="196" y2="178" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="150" y1="137" x2="196" y2="184" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="150" y1="199" x2="196" y2="190" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="150" y1="256" x2="196" y2="196" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="150" y1="308" x2="196" y2="202" class="arr" marker-end="url(#arrow)" stroke-width="1"/>

<g class="c-teal"><rect x="196" y="162" width="90" height="50" rx="8" stroke-width="0.5"/><text class="th" x="241" y="181" text-anchor="middle" dominant-baseline="central">Mixer</text><text class="ts" x="241" y="198" text-anchor="middle" dominant-baseline="central">Level balance</text></g>
<line x1="286" y1="187" x2="316" y2="187" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="316" y="162" width="96" height="50" rx="8" stroke-width="0.5"/><text class="th" x="364" y="181" text-anchor="middle" dominant-baseline="central">LP filter</text><text class="ts" x="364" y="198" text-anchor="middle" dominant-baseline="central">20 Hz–18 kHz</text></g>
<line x1="412" y1="187" x2="440" y2="187" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="440" y="162" width="90" height="50" rx="8" stroke-width="0.5"/><text class="th" x="485" y="181" text-anchor="middle" dominant-baseline="central">VCA</text><text class="ts" x="485" y="198" text-anchor="middle" dominant-baseline="central">Volume env.</text></g>
<line x1="530" y1="187" x2="558" y2="187" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="558" y="150" width="98" height="76" rx="8" stroke-width="0.5"/><text class="th" x="607" y="172" text-anchor="middle" dominant-baseline="central">Effects</text><text class="ts" x="607" y="189" text-anchor="middle" dominant-baseline="central">Chorus (4-tap)</text><text class="ts" x="607" y="206" text-anchor="middle" dominant-baseline="central">Stereo delay</text></g>
<line x1="607" y1="226" x2="607" y2="268" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="558" y="268" width="98" height="44" rx="8" stroke-width="0.5"/><text class="th" x="607" y="292" text-anchor="middle" dominant-baseline="central">DAC</text></g>
<line x1="607" y1="312" x2="607" y2="345" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="607" y="362" text-anchor="middle">Audio out</text>

<g class="c-amber"><rect x="196" y="390" width="90" height="40" rx="8" stroke-width="0.5"/><text class="th" x="241" y="412" text-anchor="middle" dominant-baseline="central">LFO 1</text></g>
<g class="c-amber"><rect x="316" y="390" width="90" height="40" rx="8" stroke-width="0.5"/><text class="th" x="361" y="412" text-anchor="middle" dominant-baseline="central">LFO 2</text></g>
<g class="c-amber"><rect x="316" y="330" width="96" height="40" rx="8" stroke-width="0.5"/><text class="th" x="364" y="352" text-anchor="middle" dominant-baseline="central">Filter ADSR</text></g>
<g class="c-amber"><rect x="440" y="330" width="90" height="40" rx="8" stroke-width="0.5"/><text class="th" x="485" y="352" text-anchor="middle" dominant-baseline="central">Vol ADSR</text></g>

<line x1="241" y1="390" x2="241" y2="212" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<line x1="361" y1="390" x2="361" y2="370" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<line x1="364" y1="330" x2="364" y2="212" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<line x1="485" y1="330" x2="485" y2="212" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<text class="ts" x="90" y="358" text-anchor="middle">Portamento</text>
<text class="ts" x="90" y="373" text-anchor="middle">0–500 ms</text>
<line x1="90" y1="345" x2="90" y2="328" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<text class="ts" x="222" y="378" text-anchor="middle">Pitch/filter</text>
<text class="ts" x="342" y="378" text-anchor="middle">Filter/amp</text>

</svg>
