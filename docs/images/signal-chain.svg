<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Poly-Synth audio signal chain diagram</title>
<desc>Each of the eight voices mixes two oscillators, ring modulation, a sub oscillator and noise, shapes it with its volume envelope and places it in the stereo field by pitch. The voices are summed with automatic level scaling, then pass through a shared resonant low-pass filter, the delay, the chorus, a 30 Hz subsonic high-pass filter and the volume stage to the DAC.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
text { font-family: sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; font-weight: 400; fill: #555; }
.zone { font-size: 12px; font-weight: 700; fill: #5F5E5A; letter-spacing: 0.06em; }
.box { fill: none; stroke: #9A9890; stroke-width: 1; stroke-dasharray: 5 4; }
.arr { stroke: #555; stroke-width: 1.2; fill: none; }
.mod { stroke: #854F0B; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .th { fill: #3C3489; }
.c-purple .ts { fill: #534AB7; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .th { fill: #085041; }
.c-teal .ts { fill: #0F6E56; }
.c-coral rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral .th { fill: #712B13; }
.c-coral .ts { fill: #993C1D; }
.c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
.c-amber .th { fill: #633806; }
.c-amber .ts { fill: #854F0B; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray .th { fill: #444441; }
.c-gray .ts { fill: #5F5E5A; }
</style>
</defs>

<text class="th" x="340" y="26" text-anchor="middle">Signal chain — 8 voices, stereo</text>

<!-- ============ PER VOICE ============ -->
<rect class="box" x="18" y="44" width="472" height="318" rx="10"/>
<text class="zone" x="32" y="62">EACH VOICE (×8)</text>

<g class="c-purple"><rect x="32" y="74" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="88" y="90" text-anchor="middle" dominant-baseline="central">Osc 1</text><text class="ts" x="88" y="106" text-anchor="middle" dominant-baseline="central">Sine/Saw/Sq/Tri</text></g>
<g class="c-purple"><rect x="32" y="126" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="88" y="142" text-anchor="middle" dominant-baseline="central">Osc 2</text><text class="ts" x="88" y="158" text-anchor="middle" dominant-baseline="central">Detune 0–100¢</text></g>
<g class="c-purple"><rect x="32" y="178" width="112" height="36" rx="8" stroke-width="0.5"/><text class="th" x="88" y="196" text-anchor="middle" dominant-baseline="central">Ring mod</text></g>
<g class="c-purple"><rect x="32" y="222" width="112" height="44" rx="8" stroke-width="0.5"/><text class="th" x="88" y="238" text-anchor="middle" dominant-baseline="central">Sub osc</text><text class="ts" x="88" y="254" text-anchor="middle" dominant-baseline="central">−1 / −2 octaves</text></g>
<g class="c-purple"><rect x="32" y="274" width="112" height="36" rx="8" stroke-width="0.5"/><text class="th" x="88" y="292" text-anchor="middle" dominant-baseline="central">Noise</text></g>
<text class="ts" x="88" y="332" text-anchor="middle">Band-limited wavetables</text>
<text class="ts" x="88" y="347" text-anchor="middle">Glide 0–500 ms</text>

<line x1="144" y1="96"  x2="172" y2="182" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="144" y1="148" x2="172" y2="188" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="144" y1="196" x2="172" y2="194" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="144" y1="244" x2="172" y2="200" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
<line x1="144" y1="292" x2="172" y2="206" class="arr" marker-end="url(#arrow)" stroke-width="1"/>

<g class="c-teal"><rect x="172" y="166" width="84" height="56" rx="8" stroke-width="0.5"/><text class="th" x="214" y="186" text-anchor="middle" dominant-baseline="central">Mixer</text><text class="ts" x="214" y="203" text-anchor="middle" dominant-baseline="central">levels</text></g>
<line x1="256" y1="194" x2="278" y2="194" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="278" y="166" width="84" height="56" rx="8" stroke-width="0.5"/><text class="th" x="320" y="186" text-anchor="middle" dominant-baseline="central">VCA</text><text class="ts" x="320" y="203" text-anchor="middle" dominant-baseline="central">× velocity</text></g>
<line x1="362" y1="194" x2="384" y2="194" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="384" y="166" width="92" height="56" rx="8" stroke-width="0.5"/><text class="th" x="430" y="186" text-anchor="middle" dominant-baseline="central">Pan</text><text class="ts" x="430" y="203" text-anchor="middle" dominant-baseline="central">by pitch</text></g>

<g class="c-amber"><rect x="278" y="270" width="84" height="44" rx="8" stroke-width="0.5"/><text class="th" x="320" y="286" text-anchor="middle" dominant-baseline="central">Vol ADSR</text><text class="ts" x="320" y="302" text-anchor="middle" dominant-baseline="central">exponential</text></g>
<line x1="320" y1="270" x2="320" y2="224" class="mod" marker-end="url(#arrow)"/>

<!-- sum -->
<line x1="476" y1="194" x2="508" y2="194" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="508" y="160" width="154" height="68" rx="8" stroke-width="0.5"/><text class="th" x="585" y="180" text-anchor="middle" dominant-baseline="central">Sum of voices</text><text class="ts" x="585" y="198" text-anchor="middle" dominant-baseline="central">automatic level</text><text class="ts" x="585" y="213" text-anchor="middle" dominant-baseline="central">scaling (L + R)</text></g>

<polyline points="585,228 585,376 70,376 70,410" class="arr" marker-end="url(#arrow)"/>

<!-- ============ SHARED ============ -->
<rect class="box" x="12" y="388" width="656" height="200" rx="10"/>
<text class="zone" x="100" y="404">SHARED BY ALL VOICES (STEREO)</text>

<g class="c-teal"><rect x="24" y="412" width="92" height="64" rx="8" stroke-width="0.5"/><text class="th" x="70" y="428" text-anchor="middle" dominant-baseline="central">LP filter</text><text class="ts" x="70" y="445" text-anchor="middle" dominant-baseline="central">resonant</text><text class="ts" x="70" y="460" text-anchor="middle" dominant-baseline="central">20 Hz–18 kHz</text></g>
<line x1="116" y1="444" x2="132" y2="444" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="132" y="412" width="92" height="64" rx="8" stroke-width="0.5"/><text class="th" x="178" y="428" text-anchor="middle" dominant-baseline="central">Delay</text><text class="ts" x="178" y="445" text-anchor="middle" dominant-baseline="central">10–400 ms</text><text class="ts" x="178" y="460" text-anchor="middle" dominant-baseline="central">ping-pong</text></g>
<line x1="224" y1="444" x2="240" y2="444" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="240" y="412" width="92" height="64" rx="8" stroke-width="0.5"/><text class="th" x="286" y="428" text-anchor="middle" dominant-baseline="central">Chorus</text><text class="ts" x="286" y="445" text-anchor="middle" dominant-baseline="central">modulated</text><text class="ts" x="286" y="460" text-anchor="middle" dominant-baseline="central">stereo</text></g>
<line x1="332" y1="444" x2="348" y2="444" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="348" y="412" width="92" height="64" rx="8" stroke-width="0.5"/><text class="th" x="394" y="428" text-anchor="middle" dominant-baseline="central">High-pass</text><text class="ts" x="394" y="445" text-anchor="middle" dominant-baseline="central">30 Hz</text><text class="ts" x="394" y="460" text-anchor="middle" dominant-baseline="central">subsonic cut</text></g>
<line x1="440" y1="444" x2="456" y2="444" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="456" y="412" width="92" height="64" rx="8" stroke-width="0.5"/><text class="th" x="502" y="428" text-anchor="middle" dominant-baseline="central">Volume</text><text class="ts" x="502" y="445" text-anchor="middle" dominant-baseline="central">limit (passcode)</text><text class="ts" x="502" y="460" text-anchor="middle" dominant-baseline="central">preset level</text></g>
<line x1="548" y1="444" x2="564" y2="444" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="564" y="412" width="92" height="64" rx="8" stroke-width="0.5"/><text class="th" x="610" y="428" text-anchor="middle" dominant-baseline="central">DAC</text><text class="ts" x="610" y="445" text-anchor="middle" dominant-baseline="central">PCM5102A</text><text class="ts" x="610" y="460" text-anchor="middle" dominant-baseline="central">44.1 kHz</text></g>
<line x1="610" y1="476" x2="610" y2="520" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="610" y="538" text-anchor="middle">Audio out</text>
<text class="ts" x="610" y="554" text-anchor="middle">L + R</text>

<g class="c-amber"><rect x="24" y="520" width="92" height="44" rx="8" stroke-width="0.5"/><text class="th" x="70" y="536" text-anchor="middle" dominant-baseline="central">Filter ADSR</text><text class="ts" x="70" y="552" text-anchor="middle" dominant-baseline="central">exponential</text></g>
<line x1="70" y1="520" x2="70" y2="478" class="mod" marker-end="url(#arrow)"/>

<g class="c-amber"><rect x="132" y="520" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="232" y="536" text-anchor="middle" dominant-baseline="central">LFO 1 · LFO 2</text><text class="ts" x="232" y="552" text-anchor="middle" dominant-baseline="central">filter · pitch · amp · Osc 2 detune</text></g>
<line x1="150" y1="520" x2="108" y2="478" class="mod" marker-end="url(#arrow)"/>
<text class="ts" x="346" y="540">LFOs also modulate the voices</text>
<text class="ts" x="346" y="555">(pitch, amplitude, detune)</text>

</svg>
